[package]
name = "enrk-igra"
version = "1.0.0"
edition = "2021"
authors = ["ENRK Community <enrk@kaspa.network>"]
description = "Immutable stablecoin protocol on Kaspa - ENRK (Energy Reserve Kaspa)"
repository = "https://github.com/cyprox/ENRK_stablecoin"
license = "GPL-3.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
hex = "0.4"
num-traits = "0.2"
num-bigint = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
